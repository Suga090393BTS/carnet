<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurum</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurum">
<meta name="theme-color" content="#1a1a19">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e;
    --muted: #898781; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --err: #d03b3b;
    --baseline: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --text: #ffffff; --text-2: #c3c2b7;
      --muted: #898781; --border: rgba(255,255,255,0.10); --accent: #3987e5; --err: #e66767;
      --baseline: #383835;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 36px; max-width: 400px; width: 100%; text-align: center;
  }
  .lock-icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  h1 span { color: var(--muted); font-weight: 500; }
  p.hint { color: var(--text-2); font-size: 13.5px; margin-bottom: 22px; }
  input {
    font: inherit; font-size: 18px; text-align: center;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--baseline); border-radius: 10px;
    padding: 11px 12px; width: 100%; margin-bottom: 12px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 11px 0; width: 100%;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .err { color: var(--err); font-size: 13.5px; margin-top: 12px; min-height: 18px; }
  .foot { color: var(--muted); font-size: 11.5px; margin-top: 18px; }
</style>
</head>
<body>
<div class="lock-card">
  <div class="lock-icon">🔒</div>
  <h1>Aurum <span>· Patrimoine</span></h1>
  <p class="hint">Entrez votre code, ou l'une de vos phrases.</p>
  <form id="lock-form">
    <input type="password" id="pw" autocomplete="off" placeholder="Code ou phrase" autofocus>
    <button type="submit" id="go">Déverrouiller</button>
  </form>
  <p class="err" id="err"></p>
  <p class="foot">Chiffrement AES-256 · vos données ne circulent jamais en clair</p>
</div>

const DATA_B64="";
const b64ToBuf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const normSecret = s => (s || "").toLowerCase().replace(/[^a-z0-9àâäéèêëîïôöùûüç]+/g, " ").trim().replace(/\s+/g, " ");
document.getElementById("lock-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Déchiffrement…";
  try {
    const input = document.getElementById("pw").value;
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(normSecret(input)), "PBKDF2", false, ["deriveKey"]);
    const dk = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBuf(SALT_B64), iterations: 310000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    let Kraw = null;
    for (const w of WRAPS_B64.split("|")) {
      const buf = b64ToBuf(w);
      try {
        Kraw = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, dk, buf.slice(12)));
        break;
      } catch (ignored) { /* pas ce wrap : on essaie le suivant */ }
    }
    if (!Kraw) throw new Error("aucun wrap");
    const K = await crypto.subtle.importKey("raw", Kraw, { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
    const pdata = b64ToBuf(PAYLOAD_B64);
    const src = new TextDecoder().decode(
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: pdata.slice(0, 12) }, K, pdata.slice(12)));
    let data = null;
    if (DATA_B64) {
      const dot = DATA_B64.indexOf(".");
      data = new TextDecoder().decode(await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBuf(DATA_B64.slice(0, dot)) }, K, b64ToBuf(DATA_B64.slice(dot + 1))));
    }
    window.__AURUM_KEY = K;
    window.__AURUM_SRC = src;
    window.__AURUM_DATA = data;
    window.__AURUM_SHELL = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    // Injecter l'app dans le document courant (même origine → localStorage préservé).
    // document.write n'exécute pas les scripts ici : on recrée les <script>,
    // enveloppés dans une IIFE pour isoler leurs déclarations de celles du shell.
    const doc = new DOMParser().parseFromString(src, "text/html");
    document.title = doc.title || "Aurum";
    document.head.innerHTML = doc.head.innerHTML;
    const scripts = [...doc.body.querySelectorAll("script")];
    scripts.forEach(s => s.remove());
    document.body.innerHTML = doc.body.innerHTML;
    for (const old of scripts) {
      const s = document.createElement("script");
      s.textContent = "(function(){\n" + old.textContent + "\n})();";
      document.body.appendChild(s);
    }
  } catch (ex) {
    err.textContent = "Code ou phrase incorrect.";
    btn.disabled = false; btn.textContent = "Déverrouiller";
    document.getElementById("pw").select();
  }
});

  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
